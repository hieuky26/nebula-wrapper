# Build Windows + Linux trên runner GitHub. Chạy thủ công (Actions → Run workflow)
# hoặc tự động khi push tag dạng v1.2.3 (khi đó tạo GitHub Release dạng draft).
#
name: build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04   # glibc cũ hơn → chạy được trên nhiều bản phân phối hơn
            name: linux
            bundles: appimage,deb,rpm
            files: |
              src-tauri/target/release/bundle/appimage/*.AppImage
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/rpm/*.rpm
          - os: windows-latest
            name: windows
            bundles: nsis,msi
            files: |
              src-tauri/target/release/bundle/nsis/*.exe
              src-tauri/target/release/bundle/msi/*.msi
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libssl-dev patchelf file
      - run: npm ci
      - name: Unit tests (chính sách điều hướng)
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: npx tauri build --bundles ${{ matrix.bundles }}
      - uses: actions/upload-artifact@v5
        with:
          name: nebula-${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with: { path: out, pattern: "nebula-*" }
      - name: Checksums
        run: cd out && find . -type f \( -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' -o -name '*.exe' -o -name '*.msi' \) -exec sha256sum {} + > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            out/**/*.AppImage
            out/**/*.deb
            out/**/*.rpm
            out/**/*.exe
            out/**/*.msi
            out/SHA256SUMS
