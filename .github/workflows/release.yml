# Build Windows + Linux + iOS trên runner GitHub. Chạy thủ công (Actions → Run workflow)
# hoặc tự động khi push tag dạng v1.2.3 (khi đó tạo GitHub Release dạng draft).
#
# Secrets cho iOS (Settings → Secrets and variables → Actions). Thiếu secrets → chỉ build bản Simulator.
#   APPLE_DEVELOPMENT_TEAM    Team ID 10 ký tự
#   IOS_CERTIFICATE           base64 của file .p12 (Apple Distribution hoặc Apple Development)
#   IOS_CERTIFICATE_PASSWORD  mật khẩu file .p12
#   IOS_MOBILE_PROVISION      base64 của provisioning profile khớp bundle id vn.ai.zyxel.nebula
# Variable (không bí mật): IOS_EXPORT_METHOD = release-testing | app-store-connect | debugging
name: build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04   # glibc cũ hơn → chạy được trên nhiều bản phân phối hơn
            name: linux
            bundles: appimage,deb,rpm
            files: |
              src-tauri/target/release/bundle/appimage/*.AppImage
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/rpm/*.rpm
          - os: windows-latest
            name: windows
            bundles: nsis,msi
            files: |
              src-tauri/target/release/bundle/nsis/*.exe
              src-tauri/target/release/bundle/msi/*.msi
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libssl-dev patchelf file
      - run: npm ci
      - name: Unit tests (chính sách điều hướng)
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: npx tauri build --bundles ${{ matrix.bundles }}
      - uses: actions/upload-artifact@v5
        with:
          name: nebula-${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  ios:
    runs-on: macos-latest
    # Lỗi iOS không chặn việc tạo bản Windows/Linux.
    continue-on-error: true
    env:
      APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}
      IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE }}
      IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
      IOS_MOBILE_PROVISION: ${{ secrets.IOS_MOBILE_PROVISION }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios" }
      - uses: swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: npm ci
      - name: Tạo dự án Xcode (nếu chưa commit src-tauri/gen/apple)
        run: test -d src-tauri/gen/apple || npx tauri ios init --ci
      - name: Build IPA đã ký
        if: env.IOS_CERTIFICATE != '' && env.IOS_MOBILE_PROVISION != ''
        run: npx tauri ios build --ci --export-method "${{ vars.IOS_EXPORT_METHOD || 'release-testing' }}"
      # Chưa có chứng chỉ: build bản Simulator bằng xcodebuild và tắt hẳn việc ký,
      # vì `tauri ios build` luôn chạy archive + export nên bắt buộc phải có Team/chứng chỉ.
      - name: Build Simulator (không cần ký)
        if: env.IOS_CERTIFICATE == '' || env.IOS_MOBILE_PROVISION == ''
        run: |
          set -euo pipefail
          PROJ=$(ls -d src-tauri/gen/apple/*.xcodeproj | head -1)
          SCHEME=$(xcodebuild -list -json -project "$PROJ" | python3 -c 'import json,sys; s=json.load(sys.stdin)["project"]["schemes"]; print(next(x for x in s if x.endswith("_iOS")))')
          echo "Project: $PROJ  Scheme: $SCHEME"
          xcodebuild -project "$PROJ" -scheme "$SCHEME" \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -arch arm64 \
            -derivedDataPath src-tauri/gen/apple/build/sim \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - uses: actions/upload-artifact@v5
        with:
          name: nebula-ios
          path: |
            src-tauri/gen/apple/build/**/*.ipa
            src-tauri/gen/apple/build/**/*.app
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [desktop, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with: { path: out, pattern: "nebula-*" }
      - name: Checksums
        run: cd out && find . -type f \( -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' -o -name '*.exe' -o -name '*.msi' -o -name '*.ipa' \) -exec sha256sum {} + > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            out/**/*.AppImage
            out/**/*.deb
            out/**/*.rpm
            out/**/*.exe
            out/**/*.msi
            out/**/*.ipa
            out/SHA256SUMS
