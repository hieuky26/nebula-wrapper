# Build Windows + Linux + iOS trên runner GitHub. Chạy thủ công (Actions → Run workflow)
# hoặc tự động khi push tag dạng v1.2.3 (khi đó tạo GitHub Release dạng draft).
#
# Secrets cho iOS (Settings → Secrets and variables → Actions). Thiếu secrets → chỉ build bản Simulator.
#   APPLE_DEVELOPMENT_TEAM    Team ID 10 ký tự
#   IOS_CERTIFICATE           base64 của file .p12 (Apple Distribution hoặc Apple Development)
#   IOS_CERTIFICATE_PASSWORD  mật khẩu file .p12
#   IOS_MOBILE_PROVISION      base64 của provisioning profile khớp bundle id vn.ai.zyxel.nebula
# Variable (không bí mật): IOS_EXPORT_METHOD = release-testing | app-store-connect | debugging
name: build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04   # glibc cũ hơn → chạy được trên nhiều bản phân phối hơn
            name: linux
            bundles: appimage,deb,rpm
            files: |
              src-tauri/target/release/bundle/appimage/*.AppImage
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/rpm/*.rpm
          - os: windows-latest
            name: windows
            bundles: nsis,msi
            files: |
              src-tauri/target/release/bundle/nsis/*.exe
              src-tauri/target/release/bundle/msi/*.msi
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libssl-dev patchelf file
      - run: npm ci
      - name: Unit tests (chính sách điều hướng)
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: npx tauri build --bundles ${{ matrix.bundles }}
      - uses: actions/upload-artifact@v5
        with:
          name: nebula-${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  ios:
    runs-on: macos-latest
    # Lỗi iOS không chặn việc tạo bản Windows/Linux.
    continue-on-error: true
    steps:
      # Tauri coi biến môi trường RỖNG là "có giá trị" (Team ID rỗng -> lỗi
      # "`apple.development-team` is empty"; chứng chỉ rỗng -> lỗi import).
      # Vì vậy chỉ xuất biến nào thực sự có secret.
      - name: Nạp secrets Apple (nếu có)
        env:
          S_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}
          S_CERT: ${{ secrets.IOS_CERTIFICATE }}
          S_CERT_PW: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          S_PROFILE: ${{ secrets.IOS_MOBILE_PROVISION }}
        run: |
          put() { if [ -n "$2" ]; then { echo "$1<<__EOF__"; echo "$2"; echo "__EOF__"; } >> "$GITHUB_ENV"; fi; }
          put APPLE_DEVELOPMENT_TEAM   "$S_TEAM"
          if [ -n "$S_CERT" ] && [ -n "$S_CERT_PW" ] && [ -n "$S_PROFILE" ]; then
            put IOS_CERTIFICATE          "$S_CERT"
            put IOS_CERTIFICATE_PASSWORD "$S_CERT_PW"
            put IOS_MOBILE_PROVISION     "$S_PROFILE"
            echo "IOS_SIGNED=1" >> "$GITHUB_ENV"
            echo "Có đủ chứng chỉ: build IPA đã ký."
          else
            echo "IOS_SIGNED=0" >> "$GITHUB_ENV"
            echo "Chưa có chứng chỉ Apple: chỉ build bản Simulator (không ký)."
          fi
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios" }
      - uses: swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: npm ci
      - name: Tạo dự án Xcode (nếu chưa commit src-tauri/gen/apple)
        run: test -d src-tauri/gen/apple || npx tauri ios init --ci
      - name: Build IPA đã ký
        if: env.IOS_SIGNED == '1'
        run: npx tauri ios build --ci --export-method "${{ vars.IOS_EXPORT_METHOD || 'release-testing' }}"
      # Chưa có chứng chỉ: build bản Simulator, bỏ qua ký (--no-sign).
      # Phải đi qua `tauri ios build` vì build phase Rust trong Xcode cần CLI Tauri đang chạy.
      - name: Build Simulator (không cần ký)
        if: env.IOS_SIGNED != '1'
        run: npx tauri ios build --ci --debug --no-sign --target aarch64-sim
      # Nén bằng ditto để giữ quyền thực thi của file trong .app (upload-artifact làm mất quyền này).
      - name: Đóng gói kết quả iOS
        run: |
          set -euo pipefail
          mkdir -p ios-out
          find src-tauri/gen/apple/build -maxdepth 3 -name "*.ipa" -exec cp {} ios-out/ \;
          find src-tauri/gen/apple/build -maxdepth 3 -type d -name "*.app" -not -path '*.xcarchive/*' | while read -r app; do
            ditto -c -k --keepParent "$app" "ios-out/$(basename "$app" .app)-simulator-arm64.zip"
          done
          ls -la ios-out
          test -n "$(ls -A ios-out)"
      - uses: actions/upload-artifact@v5
        with:
          name: nebula-ios
          path: ios-out/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [desktop, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with: { path: out, pattern: "nebula-*" }
      - name: Checksums
        run: cd out && find . -type f \( -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' -o -name '*.exe' -o -name '*.msi' -o -name '*.ipa' -o -name '*-simulator-*.zip' \) -exec sha256sum {} + > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            out/**/*.AppImage
            out/**/*.deb
            out/**/*.rpm
            out/**/*.exe
            out/**/*.msi
            out/**/*.ipa
            out/SHA256SUMS
